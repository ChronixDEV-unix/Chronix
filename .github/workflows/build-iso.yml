name: Build Chronix Live ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "auto/config"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build-iso:
    name: Build Debian live image
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out Chronix
        uses: actions/checkout@v4

      - name: Install live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin isolinux syslinux-common mtools dosfstools

      - name: Fix Debian Contents index path in live-build
        run: |
          SCRIPT="/usr/lib/live/build/lb_chroot_linux-image"
          if ! grep -q 'dists/${LB_PARENT_DISTRIBUTION}/Contents-' "$SCRIPT"; then
            echo "Expected live-build Contents URL pattern was not found." >&2
            exit 1
          fi
          sudo sed -i \
            -e 's|dists/${LB_PARENT_DISTRIBUTION}/Contents-|dists/${LB_PARENT_DISTRIBUTION}/main/Contents-|g' \
            -e 's|dists/${LB_DISTRIBUTION}/Contents-|dists/${LB_DISTRIBUTION}/main/Contents-|g' \
            "$SCRIPT"
          grep -n 'Contents-${LB_ARCHITECTURES}' "$SCRIPT"

      - name: Prepare ISOLINUX files for live-build
        run: |
          # Prepare matching BIOS ISOLINUX/SYSLINUX assets before live-build
          # configuration or image construction begins.
          DEST="/root/isolinux"
          BIOS_MODULES="/usr/lib/syslinux/modules/bios"
          sudo mkdir -p "$DEST"

          ISOLINUX_BIN="$(find /usr/lib -path '*/ISOLINUX/isolinux.bin' -print -quit)"
          if [ -z "$ISOLINUX_BIN" ]; then
            echo "ISOLINUX isolinux.bin was not installed." >&2
            exit 1
          fi
          sudo cp -L "$ISOLINUX_BIN" "$DEST/isolinux.bin"

          for file in vesamenu.c32 ldlinux.c32 libcom32.c32 libgpl.c32 libmenu.c32 libutil.c32; do
            source_file="$BIOS_MODULES/$file"
            if [ ! -s "$source_file" ]; then
              echo "Required BIOS SYSLINUX module is missing: $source_file" >&2
              exit 1
            fi
            sudo cp -L "$source_file" "$DEST/$file"
          done

          echo "Prepared BIOS boot files:"
          sudo ls -lh "$DEST"
          sudo bash -c 'for file in isolinux.bin vesamenu.c32 ldlinux.c32; do
            if [ ! -s "/root/isolinux/$file" ]; then
              echo "Verification failed: $file is missing or empty" >&2
              exit 1
            fi
          done'
          echo "ISOLINUX and BIOS module verification passed."

      - name: Configure Chronix
        run: |
          chmod +x auto/config
          sudo lb config

      - name: Build ISO
        run: sudo lb build

      - name: Verify ISO output
        id: verify
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$ISO" ]; then
            echo "No ISO was produced." >&2
            exit 1
          fi
          SIZE="$(stat -c '%s' "$ISO")"
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO"
          file "$ISO"

      - name: Upload ISO build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronix-live-amd64
          path: ${{ steps.verify.outputs.iso }}
          if-no-files-found: error
          retention-days: 1
