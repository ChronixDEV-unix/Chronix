name: Build Chronix Live ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    name: Build Debian live image
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out Chronix
        uses: actions/checkout@v4

      - name: Install live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Stage Syslinux boot assets for live-build
        run: |
          mkdir -p /tmp/chronix-syslinux /tmp/chronix-syslinux-extracted
          cd /tmp/chronix-syslinux
          apt-get download isolinux syslinux-common
          for package in ./*.deb; do
            dpkg-deb -x "$package" /tmp/chronix-syslinux-extracted
          done
          ISOLINUX_BIN="$(find /tmp/chronix-syslinux-extracted -type f -name isolinux.bin -print -quit)"
          VESAMENU="$(find /tmp/chronix-syslinux-extracted -type f -name vesamenu.c32 -print -quit)"
          test -n "$ISOLINUX_BIN"
          test -n "$VESAMENU"
          mkdir -p "$GITHUB_WORKSPACE/config/includes.chroot/root/isolinux"
          install -m 0644 "$ISOLINUX_BIN" "$GITHUB_WORKSPACE/config/includes.chroot/root/isolinux/isolinux.bin"
          install -m 0644 "$VESAMENU" "$GITHUB_WORKSPACE/config/includes.chroot/root/isolinux/vesamenu.c32"
          ls -l "$GITHUB_WORKSPACE/config/includes.chroot/root/isolinux"

      - name: Fix Debian Contents index path in live-build
        run: |
          SCRIPT="/usr/lib/live/build/lb_chroot_linux-image"
          if ! grep -q 'dists/${LB_PARENT_DISTRIBUTION}/Contents-' "$SCRIPT"; then
            echo "Expected live-build Contents URL pattern was not found." >&2
            exit 1
          fi
          sudo sed -i \
            -e 's|dists/${LB_PARENT_DISTRIBUTION}/Contents-|dists/${LB_PARENT_DISTRIBUTION}/main/Contents-|g' \
            -e 's|dists/${LB_DISTRIBUTION}/Contents-|dists/${LB_DISTRIBUTION}/main/Contents-|g' \
            "$SCRIPT"
          grep -n 'Contents-${LB_ARCHITECTURES}' "$SCRIPT"

      - name: Configure Chronix
        run: |
          chmod +x auto/config
          sudo lb config

      - name: Build ISO
        run: sudo lb build

      - name: Verify ISO output
        id: verify
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$ISO" ]; then
            echo "No ISO was produced." >&2
            exit 1
          fi
          SIZE="$(stat -c '%s' "$ISO")"
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO"
          file "$ISO"

      - name: Upload ISO build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronix-live-amd64
          path: ${{ steps.verify.outputs.iso }}
          if-no-files-found: error
          retention-days: 1
