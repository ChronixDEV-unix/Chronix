name: Build Chronix Live ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "auto/config"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build-iso:
    name: Build Debian live image
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out Chronix
        uses: actions/checkout@v4

      - name: Install live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin isolinux syslinux-common mtools dosfstools

      - name: Fix Debian Contents index path in live-build
        run: |
          SCRIPT="/usr/lib/live/build/lb_chroot_linux-image"
          if ! grep -q 'dists/${LB_PARENT_DISTRIBUTION}/Contents-' "$SCRIPT"; then
            echo "Expected live-build Contents URL pattern was not found." >&2
            exit 1
          fi
          sudo sed -i \
            -e 's|dists/${LB_PARENT_DISTRIBUTION}/Contents-|dists/${LB_PARENT_DISTRIBUTION}/main/Contents-|g' \
            -e 's|dists/${LB_DISTRIBUTION}/Contents-|dists/${LB_DISTRIBUTION}/main/Contents-|g' \
            "$SCRIPT"
          grep -n 'Contents-${LB_ARCHITECTURES}' "$SCRIPT"

      - name: Configure Chronix
        run: |
          chmod +x auto/config
          sudo lb config

      - name: Prepare ISOLINUX files for live-build
        run: |
          # Ubuntu and Debian package the SYSLINUX files in different locations.
          # Locate the installed files instead of assuming a distro-specific path.
          DEST="/root/isolinux"
          sudo mkdir -p "$DEST"

          find_boot_file() {
            name="$1"
            found="$(find /usr -name "$name" -print -quit 2>/dev/null || true)"
            if [ -z "$found" ]; then
              echo "Could not find required boot file: $name" >&2
              return 1
            fi
            printf '%s\n' "$found"
          }

          for file in isolinux.bin vesamenu.c32; do
            source_file="$(find_boot_file "$file")"
            echo "Using $source_file"
            sudo cp -L "$source_file" "$DEST/$file"
          done

          # Copy supporting modules when they are present. Some distributions
          # package a different set, so these are optional at this stage.
          for file in ldlinux.c32 libcom32.c32 libgpl.c32 libmenu.c32 libutil.c32; do
            source_file="$(find /usr -name "$file" -print -quit 2>/dev/null || true)"
            if [ -n "$source_file" ]; then
              echo "Using optional module $source_file"
              sudo cp -L "$source_file" "$DEST/$file"
            fi
          done

          test -s "$DEST/isolinux.bin"
          test -s "$DEST/vesamenu.c32"
          sudo ls -l "$DEST"

      - name: Build ISO
        run: sudo lb build

      - name: Verify ISO output
        id: verify
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$ISO" ]; then
            echo "No ISO was produced." >&2
            exit 1
          fi
          SIZE="$(stat -c '%s' "$ISO")"
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO"
          file "$ISO"

      - name: Upload ISO build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronix-live-amd64
          path: ${{ steps.verify.outputs.iso }}
          if-no-files-found: error
          retention-days: 1
