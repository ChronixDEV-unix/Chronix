name: Build Chronix Live ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "auto/config"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build-iso:
    name: Build Debian live image
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out Chronix
        uses: actions/checkout@v4

      - name: Install live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin isolinux syslinux-common mtools dosfstools

      - name: Fix Debian Contents index path in live-build
        run: |
          SCRIPT="/usr/lib/live/build/lb_chroot_linux-image"
          if ! grep -q 'dists/${LB_PARENT_DISTRIBUTION}/Contents-' "$SCRIPT"; then
            echo "Expected live-build Contents URL pattern was not found." >&2
            exit 1
          fi
          sudo sed -i \
            -e 's|dists/${LB_PARENT_DISTRIBUTION}/Contents-|dists/${LB_PARENT_DISTRIBUTION}/main/Contents-|g' \
            -e 's|dists/${LB_DISTRIBUTION}/Contents-|dists/${LB_DISTRIBUTION}/main/Contents-|g' \
            "$SCRIPT"
          grep -n 'Contents-${LB_ARCHITECTURES}' "$SCRIPT"

      - name: Patch live-build boot-file staging
        run: |
          # Syslinux postinst checks /root/isolinux on the GitHub runner.
          # Stage the package assets there before Install_package runs.
          SCRIPT="/usr/lib/live/build/lb_binary_syslinux"

          sudo python3 - "$SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          marker = "# Chronix: syslinux postinst checks /root/isolinux on the runner."
          if marker in source:
              print("Chronix syslinux staging patch is already present.")
              raise SystemExit(0)

          lines = source.splitlines(keepends=True)
          matches = [
              i for i, line in enumerate(lines[:-1])
              if line.strip() == "# Installing depends"
              and lines[i + 1].strip() == "Install_package"
          ]
          if len(matches) != 1:
              raise SystemExit(f"Expected one dependency-install point, found {len(matches)}.")

          insert = """    # Chronix: syslinux postinst checks /root/isolinux on the runner.
          # The boot assets are installed on the GitHub runner by apt, so stage
          # them at that exact absolute path before Install_package runs.
          HOST_ISOLINUX="/usr/lib/ISOLINUX/isolinux.bin"
          HOST_VESAMENU="/usr/lib/syslinux/modules/bios/vesamenu.c32"
          mkdir -p /root/isolinux

          for asset in "$HOST_ISOLINUX" "$HOST_VESAMENU"; do
              if [ ! -s "$asset" ]; then
                  Echo_error "Missing runner boot asset: $asset"
                  exit 1
              fi
          done

          cp -L "$HOST_ISOLINUX" /root/isolinux/isolinux.bin
          cp -L "$HOST_VESAMENU" /root/isolinux/vesamenu.c32
          test -s /root/isolinux/isolinux.bin
          test -s /root/isolinux/vesamenu.c32
          ls -l /root/isolinux

          # Installing depends
          Install_package
          """
          i = matches[0]
          lines[i:i + 2] = [insert]
          path.write_text("".join(lines))
          PY

          sudo grep -n -A22 'Chronix: syslinux postinst checks /root/isolinux on the runner' "$SCRIPT"

      - name: Configure Chronix
        run: |
          chmod +x auto/config
          sudo lb config

      - name: Build ISO
        run: sudo lb build

      - name: Verify ISO output
        id: verify
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$ISO" ]; then
            echo "No ISO was produced." >&2
            exit 1
          fi
          SIZE="$(stat -c '%s' "$ISO")"
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO"
          file "$ISO"

      - name: Upload ISO build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronix-live-amd64
          path: ${{ steps.verify.outputs.iso }}
          if-no-files-found: error
          retention-days: 1
